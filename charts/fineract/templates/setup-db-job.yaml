{{- if .Values.externalDatabase.host }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-db-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-creator
          image: postgres:14
          env:
            - name: PGHOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: PGPORT
              value: {{ .Values.externalDatabase.port | quote }}
            - name: PGUSER
              value: {{ .Values.externalDatabase.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.secretName }}
                  key: {{ .Values.externalDatabase.secretKey }}
          command:
            - sh
            - "-c"
            - |
              echo "Checking if database fineract_default exists..."
              if psql -lqt | cut -d \| -f 1 | grep -qw fineract_default; then
                echo "Database fineract_default already exists."
              else
                echo "Database fineract_default does not exist. Creating..."
                createdb fineract_default
                echo "Database fineract_default created."
              fi
{{- end }}
