apiVersion: v2
name: webank
description: A Helm chart for Kubernetes

type: application

version: 1.3.1-rc.15

appVersion: "1.16.0"

dependencies:
  - name: webank-obs
    repository: "https://ADORSYS-GIS.github.io/webank-devops/"
    version: 1.3.0-rc.8
    alias: obs
  - name: webank-userapp
    repository: "https://ADORSYS-GIS.github.io/webank-devops/"
    version: 1.1.0-rc.3
    alias: userapp
  - name: webank-prs
    repository: "https://ADORSYS-GIS.github.io/webank-devops/"
    version: 1.2.0-rc.4
    alias: prs
  - name: fineract
    repository: "https://ADORSYS-GIS.github.io/webank-devops/"
    version: "0.1.0" 
    alias: fineract
  - name: postgresql
    repository: "https://repo.broadcom.com/bitnami-files/"
    version: 16.2.3
    alias: db
    condition: db.enabled
  - name: common
    repository: "https://repo.broadcom.com/bitnami-files/"
    version: 2.27.0