apiVersion: v2
name: webank
description: A Helm chart for Kubernetes

type: application

version: 1.3.0

appVersion: "1.16.0"

dependencies:
  - name: webank-obs
    repository: "file://../webank-obs/"
    version: 1.3.0-rc
    alias: obs
  - name: webank-userapp
    repository: "file://../webank-userapp/"
    version: 1.1.0-rc
    alias: userapp
  - name: webank-prs
    repository: "file://../webank-prs/"
    version: 1.2.0-rc
    alias: prs
  - name: postgresql
    repository: "https://repo.broadcom.com/bitnami-files/"
    version: 16.2.3
    alias: db
    condition: db.enabled
  - name: common
    version: 2.27.0
    repository: "https://repo.broadcom.com/bitnami-files/"
  - name: webank-monitoring
    repository: "file://../webank-monitoring/"
    version: 0.1.0
    alias: monitoring
    condition: monitoring.enabled
