apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.admin.existingSecret | default (printf "%s-grafana-admin" (include "webank-monitoring.fullname" .)) }}
  labels:
    app: grafana
    {{- include "webank-monitoring.labels" . | nindent 4 }}
type: Opaque
{{- if not .Values.grafana.admin.existingSecret }}
data:
  {{ .Values.grafana.admin.userKey }}: {{ .Values.grafana.admin.user | b64enc | quote }}
  {{ .Values.grafana.admin.passwordKey }}: {{ .Values.grafana.admin.password | b64enc | quote }}
{{- end }}