apiVersion: v1
kind: Service
metadata:
  name: {{ include "webank-monitoring.fullname" . }}-prometheus
spec:
  type: {{ .Values.prometheus.service.type }}
  ports:
    - port: {{ .Values.prometheus.service.port }}
      targetPort: {{ .Values.prometheus.service.port }}
      protocol: TCP
      name: http
  selector:
    app: prometheus
