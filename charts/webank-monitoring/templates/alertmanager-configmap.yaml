apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  config.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: 'default'
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: 'default'
        email_configs:
          - to: 'kingkoufan@gmail.com'
            send_resolved: true
