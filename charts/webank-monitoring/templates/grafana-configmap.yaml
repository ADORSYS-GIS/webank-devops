apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webank-monitoring.fullname" . }}-grafana-config
  labels:
    app: grafana
data:
  grafana.ini: |
    # Admin credentials will be set via environment variables
    # GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default.json

    [paths]
    provisioning = /etc/grafana/provisioning
