prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.52.0
  service:
    type: ClusterIP
    port: 9090
  config:
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_configs:
      - job_name: 'webank-obs-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['dev.webank.gis.ssegning.com/api']
      - job_name: 'webank-prs-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['dev.webank.gis.ssegning.com/api/prs']

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.0.0
  service:
    type: ClusterIP
    port: 3000
  dashboards:
    enabled: true
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
  datasources:
    - name: Prometheus
      type: prometheus
      url: https://prometheus.dev.webank.gis.ssegning.com
      isDefault: true
  admin:
    existingSecret: webank-monitoring-secret
    userKey: admin-user
    passwordKey: admin-password

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  service:
    type: ClusterIP
    port: 9093

ingress:
  enabled: true
  domain: dev.webank.gis.ssegning.com
